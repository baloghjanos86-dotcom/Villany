<!DOCTYPE html>
<html lang="hu" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Villanyszerelő Szakmai App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans">

    <!-- FEJLÉC -->
    <header class="bg-gray-900 border-b border-gray-800 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <span class="text-amber-500 text-xl font-bold">⚡ VillanyApp</span>
        </div>
        <div id="user-info" class="hidden flex items-center space-x-4">
            <span id="user-email" class="text-sm text-gray-400"></span>
            <button id="logout-btn" class="text-xs bg-red-600/20 text-red-400 border border-red-600/30 hover:bg-red-600/30 px-3 py-1.5 rounded-lg transition">
                Kijelentkezés
            </button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-6">

        <!-- BEJELENTKEZÉS / REGISZTRÁCIÓ (AUTH) -->
        <div id="auth-container" class="max-w-md mx-auto mt-10 bg-gray-900 border border-gray-800 rounded-xl p-6 shadow-lg">
            <h2 class="text-lg font-bold text-white mb-4">Belépés a rendszerbe</h2>
            <form id="auth-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-300 mb-1">E-mail cím</label>
                    <input type="email" id="email" required class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-300 mb-1">Jelszó</label>
                    <input type="password" id="password" required class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                </div>
                <div id="auth-error" class="hidden text-xs text-red-400 bg-red-950/50 border border-red-800 p-2.5 rounded-lg"></div>
                <div class="flex space-x-3 pt-2">
                    <button id="login-btn" class="flex-1 bg-amber-500 hover:bg-amber-600 text-gray-950 font-bold py-2 px-4 rounded-lg text-sm transition">Belépés</button>
                    <button id="register-btn" class="flex-1 bg-gray-800 hover:bg-gray-700 text-gray-200 font-medium py-2 px-4 rounded-lg text-sm transition">Regisztráció</button>
                </div>
            </form>
        </div>

        <!-- FŐ ALKALMAZÁS KONTÉNER -->
        <div id="app-container" class="hidden space-y-6">

            <!-- NAVIGÁCIÓS FÜLEK (TABS) -->
            <div class="flex space-x-2 border-b border-gray-800 pb-4">
                <button id="tab-tananyag" onclick="switchTab('tananyag')" class="px-4 py-2 text-sm font-medium rounded-lg bg-amber-500 text-gray-950 transition">
                    📚 Tananyag és Kapcsolások
                </button>
                <button id="tab-kalkulator" onclick="switchTab('kalkulator')" class="px-4 py-2 text-sm font-medium rounded-lg bg-gray-800 text-gray-300 hover:bg-gray-700 transition">
                    🧮 Szakmai Kalkulátorok
                </button>
            </div>

            <!-- 1. NÉZET: TANANYAG -->
            <div id="view-tananyag" class="space-y-4">
                <div class="bg-gray-900 border border-gray-800 rounded-xl p-6">
                    <h2 class="text-lg font-bold text-amber-400 mb-2">Villanyszerelési Alapok</h2>
                    <p class="text-sm text-gray-300">Itt kapnak majd helyet a kapcsolási rajzok, elméleti összefoglalók és szabványok.</p>
                </div>
            </div>

            <!-- 2. NÉZET: KALKULÁTOROK -->
            <div id="view-kalkulator" class="hidden space-y-6">
                <div class="bg-gray-900 border border-gray-800 rounded-xl p-6">
                    <h3 class="text-base font-bold text-white mb-4">Áramfelvétel kalkulátor</h3>
                    <div class="space-y-4 max-w-md">
                        <div>
                            <label class="block text-xs font-medium text-gray-300 mb-1">Hálózat típusa</label>
                            <select id="calc-system" onchange="toggleCosPhi()" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                                <option value="1">Egyfázisú (230V)</option>
                                <option value="3">Háromfázisú (400V)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-300 mb-1">Teljesítmény (W)</label>
                            <input type="number" id="calc-power" placeholder="pl. 3500" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                        </div>
                        <!-- INNEN FOLYTATÓDIK A TE KÓDOD -->
                        <div id="cosphi-container" class="hidden">
                            <label class="block text-xs font-medium text-gray-300 mb-1">Teljesítménytényező (cos φ)</label>
                            <input type="number" id="calc-cosphi" value="0.82" step="0.01" min="0.5" max="1.0" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                        </div>
                        <button onclick="calculateCurrent()" class="w-full bg-amber-500 hover:bg-amber-600 text-gray-950 font-bold py-2 px-4 rounded-lg text-sm transition mt-2">Számolás</button>
                        
                        <div id="calc-result" class="hidden mt-4 p-3 bg-gray-950 border border-amber-500/30 rounded-lg text-sm text-amber-300 font-medium"></div>
                    </div>
                </div>
            </div>

        </div>

    </main>

    <!-- FIREBASE LOGIKA ÉS ALKALMAZÁS VEZÉRLÉS -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, setPersistence, browserLocalPersistence, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDmoW-G2ddk9MGT8LkcRx6IboEubl8h1D8",
            authDomain: "baloghjanos86-dotcom.github.io",
            projectId: "villanyapp-4fbc2",
            storageBucket: "villanyapp-4fbc2.firebasestorage.app",
            messagingSenderId: "14868953112",
            appId: "1:220375048900:web:4f683f77dc5a7bd5ab9f91"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        setPersistence(auth, browserLocalPersistence).catch((error) => {
            console.error("Perzisztencia hiba:", error);
        });

        const authContainer = document.getElementById('auth-container');
        const appContainer = document
