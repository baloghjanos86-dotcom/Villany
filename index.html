<!DOCTYPE html>
<html lang="hu" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Villanyszerelő Szakmai App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans">

    <!-- FEJLÉC -->
    <header class="bg-gray-900 border-b border-gray-800 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <span class="text-amber-500 text-xl font-bold">⚡ VillanyApp</span>
        </div>
        <div id="user-info" class="hidden flex items-center space-x-4">
            <span id="user-email" class="text-sm text-gray-400"></span>
            <button id="logout-btn" type="button" class="text-xs bg-red-600/20 text-red-400 border border-red-600/30 hover:bg-red-600/30 px-3 py-1.5 rounded-lg transition">
                Kijelentkezés
            </button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-6">

        <!-- BEJELENTKEZÉS / REGISZTRÁCIÓ (AUTH) -->
        <div id="auth-container" class="max-w-md mx-auto mt-10 bg-gray-900 border border-gray-800 rounded-xl p-6 shadow-lg">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-white">Belépés a rendszerbe</h2>
                <span id="sys-status" class="text-xs px-2 py-1 rounded bg-gray-800 text-gray-400">⏳ Betöltés...</span>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-300 mb-1">E-mail cím</label>
                    <input type="email" id="email" placeholder="pelda@email.hu" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-300 mb-1">Jelszó (min. 6 karakter)</label>
                    <input type="password" id="password" placeholder="••••••" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                </div>
                
                <!-- Hiba / Állapot üzenet helye -->
                <div id="auth-error" class="hidden text-xs p-3 rounded-lg border"></div>

                <div class="flex space-x-3 pt-2">
                    <button type="button" id="login-btn" class="flex-1 bg-amber-500 hover:bg-amber-600 text-gray-950 font-bold py-2 px-4 rounded-lg text-sm transition cursor-pointer">
                        Belépés
                    </button>
                    <button type="button" id="register-btn" class="flex-1 bg-gray-800 hover:bg-gray-700 text-gray-200 font-medium py-2 px-4 rounded-lg text-sm transition cursor-pointer">
                        Regisztráció
                    </button>
                </div>
            </div>
        </div>

        <!-- FŐ ALKALMAZÁS KONTÉNER -->
        <div id="app-container" class="hidden space-y-6">

            <!-- NAVIGÁCIÓS FÜLEK (TABS) -->
            <div class="flex space-x-2 border-b border-gray-800 pb-4">
                <button id="tab-tananyag" type="button" onclick="switchTab('tananyag')" class="px-4 py-2 text-sm font-medium rounded-lg bg-amber-500 text-gray-950 transition">
                    📚 Tananyag és Kapcsolások
                </button>
                <button id="tab-kalkulator" type="button" onclick="switchTab('kalkulator')" class="px-4 py-2 text-sm font-medium rounded-lg bg-gray-800 text-gray-300 hover:bg-gray-700 transition">
                    🧮 Szakmai Kalkulátorok
                </button>
            </div>

            <!-- 1. NÉZET: TANANYAG -->
            <div id="view-tananyag" class="space-y-4">
                <div class="bg-gray-900 border border-gray-800 rounded-xl p-6">
                    <h2 class="text-lg font-bold text-amber-400 mb-2">Villanyszerelési Alapok</h2>
                    <p class="text-sm text-gray-300">Sikeres belépés! Itt kapnak majd helyet a kapcsolási rajzok, elméleti összefoglalók és szabványok.</p>
                </div>
            </div>

            <!-- 2. NÉZET: KALKULÁTOROK -->
            <div id="view-kalkulator" class="hidden space-y-6">
                <div class="bg-gray-900 border border-gray-800 rounded-xl p-6">
                    <h3 class="text-base font-bold text-white mb-4">Áramfelvétel kalkulátor</h3>
                    <div class="space-y-4 max-w-md">
                        <div>
                            <label class="block text-xs font-medium text-gray-300 mb-1">Hálózat típusa</label>
                            <select id="calc-system" onchange="toggleCosPhi()" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                                <option value="1">Egyfázisú (230V)</option>
                                <option value="3">Háromfázisú (400V)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-300 mb-1">Teljesítmény (W)</label>
                            <input type="number" id="calc-power" placeholder="pl. 3500" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                        </div>
                        <div id="cosphi-container" class="hidden">
                            <label class="block text-xs font-medium text-gray-300 mb-1">Teljesítménytényező (cos φ)</label>
                            <input type="number" id="calc-cosphi" value="0.82" step="0.01" min="0.5" max="1.0" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                        </div>
                        <button type="button" onclick="calculateCurrent()" class="w-full bg-amber-500 hover:bg-amber-600 text-gray-950 font-bold py-2 px-4 rounded-lg text-sm transition mt-2">
                            Számolás
                        </button>
                        
                        <div id="calc-result" class="hidden mt-4 p-3 bg-gray-950 border border-amber-500/30 rounded-lg text-sm text-amber-300 font-medium"></div>
                    </div>
                </div>
            </div>

        </div>

    </main>

    <!-- ELLENŐRZÉS: Ha file:// protokollról nyitják meg, szólunk -->
    <script>
        if (window.location.protocol === 'file:') {
            const errBox = document.getElementById('auth-error');
            const statusBadge = document.getElementById('sys-status');
            if (statusBadge) {
                statusBadge.textContent = "❌ Helyi fájl hiba";
                statusBadge.className = "text-xs px-2 py-1 rounded bg-red-900/50 text-red-300";
            }
            if (errBox) {
                errBox.className = "text-xs p-3 rounded-lg border bg-amber-950/60 border-amber-600 text-amber-200";
                errBox.innerHTML = "<strong>Figyelem!</strong> A fájlt közvetlenül a gépről (file://) nyitottad meg. A böngésző ilyenkor biztonsági okból letiltja a Firebase működését. Töltsd fel GitHub Pages-re, vagy használd a VS Code Live Server-t!";
                errBox.classList.remove('hidden');
            }
        }
    </script>

    <!-- FIREBASE LOGIKA ÉS ALKALMAZÁS VEZÉRLÉS -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, setPersistence, browserLocalPersistence, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const statusBadge = document.getElementById('sys-status');
        const authError = document.getElementById('auth-error');

        function setMessage(text, isError = true) {
            if (!authError) return;
            authError.textContent = text;
            authError.className = isError 
                ? "text-xs p-3 rounded-lg border bg-red-950/60 border-red-700 text-red-300"
                : "text-xs p-3 rounded-lg border bg-amber-950/60 border-amber-600 text-amber-300";
            authError.classList.remove('hidden');
        }

        try {
            const firebaseConfig = {
                apiKey: "AIzaSyDmoW-G2ddk9MGT8LkcRx6IboEubl8h1D8",
                authDomain: "villanyapp-4fbc2.firebaseapp.com",
                projectId: "villanyapp-4fbc2",
                storageBucket: "villanyapp-4fbc2.firebasestorage.app",
                messagingSenderId: "14868953112",
                appId: "1:220375048900:web:4f683f77dc5a7bd5ab9f91"
            };

            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);

            if (statusBadge) {
                statusBadge.textContent = "✅ Rendszer kész";
                statusBadge.className = "text-xs px-2 py-1 rounded bg-emerald-950 text-emerald-400 border border-emerald-800";
            }

            setPersistence(auth, browserLocalPersistence).catch((error) => {
                console.warn("Perzisztencia figyelmeztetés:", error);
            });

            const authContainer = document.getElementById('auth-container');
            const appContainer = document.getElementById('app-container');
            const userInfo = document.getElementById('user-info');
            const userEmail = document.getElementById('user-email');
            const loginBtn = document.getElementById('login-btn');
            const registerBtn = document.getElementById('register-btn');
            const logoutBtn = document.getElementById('logout-btn');

            function handleFirebaseError(error) {
                console.error("Firebase Auth Hiba:", error.code, error.message);
                let msg = `Hiba (${error.code}): ${error.message}`;
                if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                    msg = "Hibás e-mail cím vagy jelszó! Ha még nem regisztráltál ezzel az e-maillel, kattints a Regisztráció gombra!";
                } else if (error.code === 'auth/email-already-in-use') {
                    msg = "Ez az e-mail cím már regisztrálva van. Kattints a Belépés gombra!";
                } else if (error.code === 'auth/weak-password') {
                    msg = "A jelszónak legalább 6 karakter hosszúnak kell lennie!";
                } else if (error.code === 'auth/invalid-email') {
                    msg = "Érvénytelen e-mail cím formátum!";
                } else if (error.code === 'auth/operation-not-allowed') {
                    msg = "Az Email/Jelszó belépés nincs engedélyezve a Firebase Console-ban (Authentication -> Sign-in method)!";
                }
                setMessage(msg, true);
            }

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    if (authContainer) authContainer.classList.add('hidden');
                    if (appContainer) appContainer.classList.remove('hidden');
                    if (userInfo) userInfo.classList.remove('hidden');
                    if (userEmail) userEmail.textContent = user.email;
                } else {
                    if (authContainer) authContainer.classList.remove('hidden');
                    if (appContainer) appContainer.classList.add('hidden');
                    if (userInfo) userInfo.classList.add('hidden');
                }
            });

            if (loginBtn) {
                loginBtn.addEventListener('click', async () => {
                    const email = document.getElementById('email').value.trim();
                    const password = document.getElementById('password').value;

                    if (!email || !password) {
                        setMessage("Kérlek írd be az e-mail címet és a jelszót is!", true);
                        return;
                    }

                    loginBtn.textContent = "Belépés...";
                    setMessage("Kapcsolódás a Firebase szerverhez...", false);

                    try {
                        await signInWithEmailAndPassword(auth, email, password);
                    } catch (error) {
                        handleFirebaseError(error);
                    } finally {
                        loginBtn.textContent = "Belépés";
                    }
                });
            }

            if (registerBtn) {
                registerBtn.addEventListener('click', async () => {
                    const email = document.getElementById('email').value.trim();
                    const password = document.getElementById('password').value;

                    if (!email || !password) {
                        setMessage("Regisztrációhoz adj meg egy e-mailt és legalább 6 karakteres jelszót!", true);
                        return;
                    }

                    registerBtn.textContent = "Fiók létrehozása...";
                    setMessage("Regisztráció folyamatban...", false);

                    try {
                        await createUserWithEmailAndPassword(auth, email, password);
                    } catch (error) {
                        handleFirebaseError(error);
                    } finally {
                        registerBtn.textContent = "Regisztráció";
                    }
                });
            }

            if (logoutBtn) {
                logoutBtn.addEventListener('click', () => {
                    signOut(auth);
                });
            }

        } catch (initError) {
            if (statusBadge) {
                statusBadge.textContent = "❌ Script hiba";
                statusBadge.className = "text-xs px-2 py-1 rounded bg-red-900 text-red-200";
            }
            setMessage("Kritikus indítási hiba: " + initError.message, true);
        }
    </script>

    <!-- UI SEGÉDFÜGGVÉNYEK -->
    <script>
        function switchTab(tabName) {
            const tabTananyag = document.getElementById('tab-tananyag');
            const tabKalkulator = document.getElementById('tab-kalkulator');
            const viewTananyag = document.getElementById('view-tananyag');
            const viewKalkulator = document.getElementById('view-kalkulator');

            if (tabName === 'tananyag') {
                tabTananyag.className = "px-4 py-2 text-sm font-medium rounded-lg bg-amber-500 text-gray-950 transition";
                tabKalkulator.className = "px-4 py-2 text-sm font-medium rounded-lg bg-gray-800 text-gray-300 hover:bg-gray-700 transition";
                viewTananyag.classList.remove('hidden');
                viewKalkulator.classList.add('hidden');
            } else {
                tabKalkulator.className = "px-4 py-2 text-sm font-medium rounded-lg bg-amber-500 text-gray-950 transition";
                tabTananyag.className = "px-4 py-2 text-sm font-medium rounded-lg bg-gray-800 text-gray-300 hover:bg-gray-700 transition";
                viewKalkulator.classList.remove('hidden');
                viewTananyag.classList.add('hidden');
            }
        }

        function toggleCosPhi() {
            const system = document.getElementById('calc-system').value;
            const cosPhiContainer = document.getElementById('cosphi-container');
            if (system === '3') {
                cosPhiContainer.classList.remove('hidden');
            } else {
                cosPhiContainer.classList.add('hidden');
            }
        }

        function calculateCurrent() {
            const system = document.getElementById('calc-system').value;
            let power = parseFloat(document.getElementById('calc-power').value);
            const resultBox = document.getElementById('calc-result');

            if (!power || power <= 0) {
                resultBox.textContent = "Kérlek add meg a teljesítményt!";
                resultBox.classList.remove('hidden');
                return;
            }

            let current = 0;
            if (system === '1') {
                current = power / 230;
                resultBox.innerHTML = `Egyfázisú áramfelvétel (230V): <strong class="text-white">${current.toFixed(2)} A</strong>`;
            } else {
                const cosPhi = parseFloat(document.getElementById('calc-cosphi').value) || 0.82;
                current = power / (Math.sqrt(3) * 400 * cosPhi);
                resultBox.innerHTML = `Háromfázisú motor áramfelvétel (400V, cos φ: ${cosPhi}): <strong class="text-white">${current.toFixed(2)} A</strong>`;
            }
            resultBox.classList.remove('hidden');
        }
    </script>
</body>
</html>
